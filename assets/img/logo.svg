<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="cgiLogoTitle">
  <title id="cgiLogoTitle">CGI Partners</title>
  <defs>
    <linearGradient id="cgiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C874"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#A8802F"/>
    </linearGradient>
  </defs>

  <!-- Monogram: interlocking C C G I -->
  <g transform="translate(10,10)">
    <!-- First C -->
    <path d="M70,0 A70,70 0 1 0 70,140 A70,70 0 0 0 121,118.5 L100,97 A42,42 0 1 1 100,43 L121,21.5 A70,70 0 0 0 70,0 Z" fill="#16233F"/>
    <!-- globe -->
    <circle cx="70" cy="70" r="24" fill="url(#cgiGold)"/>
    <path d="M50,70 a20,20 0 0 1 40,0" fill="none" stroke="#16233F" stroke-width="1.5" opacity="0.5"/>
    <path d="M70,50 a20,26 0 0 1 0,40" fill="none" stroke="#16233F" stroke-width="1.5" opacity="0.5"/>
    <path d="M52,60 h36" stroke="#16233F" stroke-width="1.5" opacity="0.5"/>
    <path d="M52,80 h36" stroke="#16233F" stroke-width="1.5" opacity="0.5"/>

    <!-- Second C (G) -->
    <g transform="translate(118,0)">
      <path d="M70,0 A70,70 0 1 0 70,140 A70,70 0 0 0 121,118.5 L100,97 A42,42 0 1 1 100,43 L121,21.5 A70,70 0 0 0 70,0 Z" fill="#16233F"/>
      <rect x="88" y="60" width="42" height="20" fill="#16233F"/>
      <rect x="106" y="60" width="6" height="20" fill="url(#cgiGold)"/>
    </g>
    <rect x="68" y="52" width="10" height="36" fill="url(#cgiGold)"/>

    <!-- I -->
    <rect x="266" y="0" width="34" height="140" fill="#16233F"/>
    <path d="M266,0 L300,0 L300,60 L266,96 Z" fill="#16233F"/>
    <path d="M268,58 L298,28" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(340,38)" font-family="'Playfair Display', Georgia, serif" fill="#16233F">
    <text x="0" y="0" font-size="46" font-weight="700" letter-spacing="1">CGI</text>
    <text x="0" y="44" font-size="30" font-weight="600" letter-spacing="1">PARTNERS</text>
  </g>
  <g transform="translate(340,96)" font-family="'Inter', Arial, sans-serif" fill="#3A4257">
    <text x="0" y="0" font-size="14" letter-spacing="2.5">CONTABILIDAD &amp; AUDITORÍA</text>
  </g>
</svg>
